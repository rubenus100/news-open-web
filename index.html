<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Open - Red de Información Libre</title>

    <!-- Evita error 404 de favicon -->
    <link rel="icon" href="data:,">

    <!-- Hoja de Estilos Principal -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Escenario 3D de Fondo (Canvas para la Tierra girando) -->
    <div id="canvas-container"></div>

    <!-- Selector de Idioma (Fijo en la esquina superior derecha) -->
    <div class="lang-selector-container">
        <label for="selector-idioma" class="visually-hidden">Seleccionar idioma</label>
        <select id="selector-idioma" class="lang-select">
            <option value="es">🇪🇸 ES</option>
            <option value="en">🇺🇸 EN</option>
            <option value="pt">🇧🇷 PT</option>
        </select>
    </div>

    <!-- Menú Lateral Izquierdo Fijo -->
    <aside id="sidebar-menu" aria-label="Menú Principal">
        <div class="sidebar-header">
            <span class="status-indicator"></span>
            <h2>NEWS_OPEN</h2>
        </div>
        
        <nav class="sidebar-nav">
            <button id="btn-open-videos" class="sidebar-btn" type="button">
                <span class="btn-icon" aria-hidden="true">📹</span>
                <span class="btn-text">Publicar Video</span>
            </button>
            
            <button id="btn-open-comentarios" class="sidebar-btn" type="button">
                <span class="btn-icon" aria-hidden="true">🌐</span>
                <span class="btn-text">Publicaciones</span>
            </button>
            
            <button id="btn-open-chat" class="sidebar-btn" type="button">
                <span class="btn-icon" aria-hidden="true">💬</span>
                <span class="btn-text">Chat en Vivo</span>
            </button>
        </nav>
    </aside>

    <!-- Modal / Panel Lateral 1: Publicar Video -->
    <section id="modal-videos" class="side-panel hidden" aria-labelledby="modal-videos-title">
        <header class="panel-header">
            <h3 id="modal-videos-title">📹 Publicar Video</h3>
            <button id="btn-close-videos" class="btn-close" type="button" aria-label="Cerrar">&times;</button>
        </header>
        <div class="panel-content">
            <p class="upload-help">Sube tu contenido directamente a la red comunitaria.</p>

            <form id="form-upload-video">
                <div class="form-group">
                    <label for="input-titulo-video">Título del Video:</label>
                    <input type="text" id="input-titulo-video" class="cyber-input" placeholder="Ej: Reporte en vivo...">
                </div>
                
                <div class="drag-drop-zone">
                    <label for="input-file-video" class="upload-label">
                        📁 Haz clic o arrastra un archivo (.mp4, .webm)
                    </label>
                    <input type="file" id="input-file-video" accept="video/mp4,video/webm" class="visually-hidden">
                </div>

                <div class="form-group">
                    <label for="video-desc">Descripción:</label>
                    <textarea id="video-desc" class="cyber-textarea" placeholder="Añade detalles o etiquetas..."></textarea>
                </div>

                <button id="btn-sincronizar-video" class="btn-primary" type="button">Transmitir a la Malla</button>
            </form>
        </div>
    </section>

    <!-- Modal / Panel Lateral 2: Publicaciones -->
    <section id="modal-comentarios" class="side-panel hidden" aria-labelledby="modal-comentarios-title">
        <header class="panel-header">
            <h3 id="modal-comentarios-title">🌐 Publicaciones Activas</h3>
            <button id="btn-close-comentarios" class="btn-close" type="button" aria-label="Cerrar">&times;</button>
        </header>
        <div class="panel-content">
            <div id="chat-messages-container" class="feed-list">
                <article class="feed-card">
                    <header>
                        <strong>@nodo_alfa</strong>
                        <time datetime="PT5M">Hace 5 min</time>
                    </header>
                    <p>Transmisión estable en el sector norte.</p>
                </article>
            </div>
            
            <div class="panel-footer">
                <label for="comentario-input" class="visually-hidden">Escribir reporte</label>
                <textarea id="comentario-input" class="cyber-textarea" placeholder="Escribe un reporte..."></textarea>
                <button id="btn-enviar-comentario" class="btn-primary" type="button">Transmitir</button>
            </div>
        </div>
    </section>

    <!-- Modal / Panel Lateral 3: Chat en Vivo -->
    <section id="modal-chat" class="side-panel hidden" aria-labelledby="modal-chat-title">
        <header class="panel-header">
            <h3 id="modal-chat-title">💬 Chat en Vivo</h3>
            <button id="btn-close-chat" class="btn-close" type="button" aria-label="Cerrar">&times;</button>
        </header>
        <div class="panel-content">
            <div id="chat-usuarios-container" class="chat-list">
                <div class="chat-message bubble">
                    <strong>@anon_user:</strong> ¿Hay alguien conectado en la zona sur?
                </div>
            </div>
            
            <div class="panel-footer chat-input-group">
                <label for="chat-live-input" class="visually-hidden">Escribir mensaje</label>
                <input type="text" id="chat-live-input" class="cyber-input" placeholder="Escribe un mensaje..." autocomplete="off">
                <button id="btn-enviar-chat" class="btn-primary" type="button">Enviar</button>
            </div>
        </div>
    </section>

    <!-- Módulos de JavaScript -->
    <script type="module" src="js/api.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/scene3d.js"></script>
    <script type="module" src="js/ui.js"></script>

</body>
</html>
